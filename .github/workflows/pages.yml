name: Test and deploy Pages
on:
  push:
    branches:
      [
        main,
        arena/01a09694-bathtuboverflowsf,
        arena/01a09707-bathtuboverflowsf,
        arena/01a097ab-bathtuboverflowsf,
        arena/01a0a734-bathtuboverflowsf,
        arena/01a0ab53-bathtuboverflowsf,
      ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        id: browser-tests
        continue-on-error: true
        run: |
          set +e
          npx playwright test --reporter=line 2>&1 | tee playwright.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Surface browser test output
        if: always()
        run: |
          if [ "${{ steps.browser-tests.outcome }}" = "failure" ] && [ -f playwright.log ]; then
            # Playwright prints failure blocks at the end, but each webServer
            # log line is long enough to push them out of a line-count tail.
            # Extract the failure blocks first, then fall back to raw bytes.
            output=$(awk '/[0-9]+\) tests\/browser/{p=1} p' playwright.log | head -c 7000 | tr '\r\n' '  ')
            if [ -z "$output" ]; then
              output=$(tail -c 4000 playwright.log | tr '\r\n' '  ')
            fi
            output=${output//'%'/'%25'}
            output=${output//$'\n'/'%0A'}
            output=${output//$'\r'/'%0D'}
            echo "::error file=.github/workflows/pages.yml,line=154,title=Browser test output::$output"
          fi
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics-${{ github.run_id }}
          path: |
            playwright.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if browser tests failed
        if: steps.browser-tests.outcome == 'failure'
        run: exit 1
      - name: Stage public files only
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css app.js lib.js _site/
          cp assets/mark.svg _site/assets/
          cp data/research.json _site/data/
          touch _site/.nojekyll
      - name: Check deployment readiness without changing repository settings
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo unavailable)
          if [ "$TYPE" = workflow ] && [ "$GITHUB_REF_NAME" = main ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Validation passed. Actions deployment skipped: build type=$TYPE, branch=$GITHUB_REF_NAME. Legacy Pages publishes main independently; this session branch is not public." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.readiness.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: test-and-build
    if: needs.test-and-build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
